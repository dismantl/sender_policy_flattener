name: Run python tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry==1.8.5
        poetry install
    - name: Test with pytest
      run: poetry run pytest --spec

  container:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build production image
      run: docker build --tag sender-policy-flattener:test .
    - name: Smoke test production image
      run: docker run --rm sender-policy-flattener:test python -m sender_policy_flattener --help
