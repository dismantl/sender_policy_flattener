[tool.poetry]
name = "sender_policy_flattener"
version = "0.3.4"
description='Condense SPF records to network blocks to avoid DNS Lookup Limits'
authors = ["Dan Staples <dan@acab.enterprises>", "Vasili Syrakis <cetanu@gmail.com>"]
license = "MIT"
readme = "README.md"
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Internet :: Name Service (DNS)',
    'Topic :: System :: Systems Administration',
    'Topic :: Utilities',
    'Intended Audience :: System Administrators',
    'Natural Language :: English',
]
keywords=['spf', 'dns', 'sender policy framework']
repository='https://github.com/dismantl/sender_policy_flattener'

[tool.poetry.scripts]
spflat = 'sender_policy_flattener.__main__:main'

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
dnspython = "^2.8.0"
netaddr = "^1.3.0"
cloudflare = "^5.7.0"
# Cloudflare's broad Pydantic constraint permits releases that predate Python
# 3.14 support. Keep the resolver on a version with CPython 3.14 wheels.
pydantic = "^2.13.5"

[tool.poetry.group.dev.dependencies]
pytest-spec = "^6.1.0"
ruff = "^0.16.7"

[tool.poetry.group.test.dependencies]  
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core>=2.4.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"
